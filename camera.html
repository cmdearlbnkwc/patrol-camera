<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>สแกน QR - ระบบตรวจเวร</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 6px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      min-height: 100px;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #1f2937;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .success {
      background: #14532d;
    }

    .error {
      background: #7f1d1d;
    }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .close {
      background: #374151;
      color: white;
    }

    .retry {
      background: #2563eb;
      color: white;
    }

    .hidden {
      display: none;
    }

    #debug {
      margin-top: 15px;
      color: #94a3b8;
      font-size: 12px;
      word-break: break-word;
      text-align: left;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>📷 สแกน QR ตรวจเวร</h1>

  <div class="subtitle">
    กดปุ่มด้านล่างเพื่อเปิดกล้อง
  </div>

  <div id="reader"></div>

  <div id="status" class="status">
    พร้อมเปิดกล้อง
  </div>

<button
 id="startButton"
 class="button start"
 onclick="startScanner()">
📷 เปิดกล้อง </button>

<button
 id="retryButton"
 class="button retry hidden"
 onclick="startScanner()">
🔄 เปิดกล้องอีกครั้ง </button>

<button
 class="button close"
 onclick="closeCamera()">
✕ ปิดกล้อง </button>

  <div id="debug"></div>

</div>

<script>

  let scanner = null;
  let scannerRunning = false;
  let sendingQR = false;


  /* =========================
     STATUS
  ========================= */

  function setStatus(message, type) {

    const el = document.getElementById("status");

    el.textContent = message;

    el.className = "status";

    if (type) {
      el.classList.add(type);
    }
  }


  /* =========================
     QR FORMAT
  ========================= */

  function extractQR(raw) {

    if (!raw) return null;

    const text = String(raw).trim();

    const match = text.match(/QR-\d+/i);

    if (!match) {
      return null;
    }

    return match[0].toUpperCase();
  }


  /* =========================
     START CAMERA
  ========================= */

  async function startScanner() {

    if (scannerRunning) {
      return;
    }

    document
      .getElementById("startButton")
      .classList.add("hidden");

    document
      .getElementById("retryButton")
      .classList.add("hidden");

    document.getElementById("debug").textContent = "";

    setStatus("📷 กำลังขอสิทธิ์ใช้กล้อง...");


    try {

      /* ---------------------------------
         ตรวจ browser / HTTPS
      --------------------------------- */

      if (!window.isSecureContext) {

        throw new Error(
          "หน้านี้ไม่ได้เปิดผ่าน HTTPS\n" +
          "กรุณาเปิดผ่าน https://"
        );
      }


      /* ---------------------------------
         ตรวจ getUserMedia
      --------------------------------- */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง"
        );
      }


      /* ---------------------------------
         ขอ Camera Permission โดยตรง
         ต้องเกิดจากการกดปุ่มของผู้ใช้
      --------------------------------- */

      setStatus("📷 กำลังขออนุญาตใช้กล้อง...");

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });


      /* ---------------------------------
         ได้ permission แล้ว
         ปิด stream ชั่วคราว
      --------------------------------- */

      stream.getTracks().forEach(function(track) {
        track.stop();
      });


      /* ---------------------------------
         สร้าง scanner
      --------------------------------- */

      if (scanner) {

        try {
          await scanner.stop();
        } catch (e) {}

        try {
          scanner.clear();
        } catch (e) {}

        scanner = null;
      }


      scanner = new Html5Qrcode("reader");


      /* ---------------------------------
         เริ่ม scanner
      --------------------------------- */

      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]
        },

        onScanSuccess,

        onScanFailure

      );


      scannerRunning = true;

      setStatus(
        "📷 เปิดกล้องแล้ว\nนำกล้องไปส่อง QR จุดตรวจ"
      );


    } catch (error) {

      scannerRunning = false;

      console.error("CAMERA ERROR", error);


      let message =
        "❌ ไม่สามารถเปิดกล้องได้";


      if (error && error.name) {

        message +=
          "\n\nชนิดข้อผิดพลาด: " +
          error.name;
      }


      if (error && error.message) {

        message +=
          "\n" +
          error.message;
      }


      /* ---------------------------------
         กรณี Permission ถูกปฏิเสธ
      --------------------------------- */

      if (
        error &&
        (
          error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError"
        )
      ) {

        message =
          "❌ Chrome ไม่ได้รับอนุญาตให้ใช้กล้อง\n\n" +
          "ตรวจสอบที่:\n" +
          "การตั้งค่า iPhone → ความเป็นส่วนตัวและความปลอดภัย → กล้อง → Chrome\n\n" +
          "แล้วเปิดอนุญาตกล้อง จากนั้นกดเปิดกล้องอีกครั้ง";
      }


      setStatus(message, "error");


      document
        .getElementById("retryButton")
        .classList.remove("hidden");


      document.getElementById("debug").textContent =
        "Camera error: " +
        String(error);
    }
  }


  /* =========================
     SCAN FAILURE
  ========================= */

  function onScanFailure(errorMessage) {

    /*
      ไม่ต้องแสดง error
      ขณะกล้องกำลังค้นหา QR
    */

  }


  /* =========================
     SCAN SUCCESS
  ========================= */

  async function onScanSuccess(decodedText) {

  if (sendingQR) {
    return;
  }

  const raw = String(decodedText || "").trim();

  if (!raw) {
    return;
  }

  sendingQR = true;

  setStatus(
    "✅ กล้องอ่าน QR ได้แล้ว\n\n" +
    "ข้อมูลที่อ่านได้:\n" +
    raw
  );

  document.getElementById("debug").textContent =
    "RAW QR = " + raw;
  }


  /* =========================
     RECEIVE RESULT
  ========================= */

  window.addEventListener(
    "message",
    async function(event) {

      const data = event.data;


      if (!data) {
        return;
      }


      if (data.type !== "PATROL_QR_RESULT") {
        return;
      }


      /* =========================
         QR ผ่าน
      ========================= */

      if (data.accepted === true) {

        setStatus(
          "✅ QR ผ่านการตรวจสอบ\n" +
          "กำลังกลับหน้าระบบตรวจเวร...",
          "success"
        );


        await stopScanner();


        setTimeout(function() {

          try {
            window.close();
          } catch (e) {}

        }, 500);


        return;
      }


      /* =========================
         QR ไม่ผ่าน
      ========================= */

      sendingQR = false;


      setStatus(

        "❌ QR ไม่ผ่าน\n" +
        (
          data.message ||
          "ไม่ใช่ QR ที่ใช้ได้ในรอบนี้"
        ),

        "error"

      );


      setTimeout(function() {

        if (scannerRunning) {

          setStatus(
            "📷 กล้องพร้อมสแกนอีกครั้ง"
          );

        }

      }, 2000);

    }
  );


  /* =========================
     STOP CAMERA
  ========================= */

  async function stopScanner() {

    if (!scanner) {
      return;
    }


    try {

      if (scannerRunning) {
        await scanner.stop();
      }

    } catch (e) {}


    try {
      scanner.clear();
    } catch (e) {}


    scanner = null;

    scannerRunning = false;
  }


  /* =========================
     CLOSE CAMERA
  ========================= */

  async function closeCamera() {

    await stopScanner();


    try {
      window.close();
    } catch (e) {}


    setStatus(
      "ปิดกล้องแล้ว\nสามารถกลับไปยังหน้าระบบตรวจเวรได้"
    );
  }


</script>

</body>
</html>

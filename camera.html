<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

  <title>ทดสอบสแกน QR - ระบบตรวจเวร</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 6px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      min-height: 100px;
    }

    .status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #1f2937;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-word;
    }

    .success {
      background: #14532d;
    }

    .error {
      background: #7f1d1d;
    }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .retry {
      background: #2563eb;
      color: white;
    }

    .close {
      background: #374151;
      color: white;
    }

    .hidden {
      display: none;
    }

    #debug {
      margin-top: 15px;
      padding: 10px;
      color: #cbd5e1;
      background: #0f172a;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      text-align: left;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 ทดสอบสแกน QR</h1>

  <div class="subtitle">
    ระบบตรวจเวร<br>
    กดเปิดกล้อง แล้วนำกล้องไปส่อง QR จุดตรวจ
  </div>

  <div id="reader"></div>

  <div id="status" class="status">
    พร้อมเปิดกล้อง
  </div>

<button
id="startButton"
class="button start"
onclick="startScanner()"

>

```
📷 เปิดกล้อง
```

  </button>

<button
id="retryButton"
class="button retry hidden"
onclick="startScanner()"

>

```
🔄 เปิดกล้องอีกครั้ง
```

  </button>

<button
class="button close"
onclick="closeCamera()"

>

```
✕ ปิดกล้อง
```

  </button>

  <div id="debug">
    ยังไม่มีข้อมูลการสแกน
  </div>

</div>

<script>

  let scanner = null;

  let scannerRunning = false;

  let scanLocked = false;


  /* ==========================================
     แสดงสถานะ
  ========================================== */

  function setStatus(message, type) {

    const el =
      document.getElementById("status");

    el.textContent = message;

    el.className = "status";

    if (type) {
      el.classList.add(type);
    }
  }


  /* ==========================================
     เปิดกล้อง
  ========================================== */

  async function startScanner() {

    if (scannerRunning) {
      return;
    }


    document
      .getElementById("startButton")
      .classList.add("hidden");


    document
      .getElementById("retryButton")
      .classList.add("hidden");


    document
      .getElementById("debug")
      .textContent =
        "กำลังเริ่มระบบสแกน QR...";


    setStatus(
      "📷 กำลังเปิดกล้อง..."
    );


    try {

      /* --------------------------------------
         ตรวจ HTTPS
      -------------------------------------- */

      if (!window.isSecureContext) {

        throw new Error(
          "หน้านี้ไม่ได้เปิดผ่าน HTTPS"
        );
      }


      /* --------------------------------------
         ตรวจ browser camera API
      -------------------------------------- */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "เบราว์เซอร์ไม่รองรับการเปิดกล้อง"
        );
      }


      /* --------------------------------------
         ขอสิทธิ์กล้องโดยตรง
      -------------------------------------- */

      setStatus(
        "📷 กำลังขอสิทธิ์ใช้กล้อง..."
      );


      const testStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


      /* --------------------------------------
         ปิด stream ทดสอบ
      -------------------------------------- */

      testStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });


      /* --------------------------------------
         ถ้ามี scanner เก่า ให้ล้าง
      -------------------------------------- */

      if (scanner) {

        try {
          await scanner.stop();
        } catch (e) {}

        try {
          scanner.clear();
        } catch (e) {}

        scanner = null;
      }


      /* --------------------------------------
         สร้าง Html5Qrcode
      -------------------------------------- */

      if (
        typeof Html5Qrcode === "undefined"
      ) {

        throw new Error(
          "โหลด html5-qrcode ไม่สำเร็จ"
        );
      }


      scanner =
        new Html5Qrcode("reader");


      /* --------------------------------------
         เริ่มสแกน
      -------------------------------------- */

      await scanner.start(

        {
          facingMode: "environment"
        },

        {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            let size =
              Math.floor(
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                ) * 0.70
              );

            if (size < 180) {
              size = 180;
            }

            if (size > 320) {
              size = 320;
            }

            return {
              width: size,
              height: size
            };
          },

          aspectRatio: 1.0,

          disableFlip: false,

          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          },

          supportedScanTypes: [

            Html5QrcodeScanType
              .SCAN_TYPE_CAMERA

          ]

        },

        onScanSuccess,

        onScanFailure

      );


      scannerRunning = true;

      scanLocked = false;


      setStatus(
        "📷 กล้องพร้อมแล้ว\n\n" +
        "นำ QR มาไว้ตรงกลางกรอบ"
      );


      document
        .getElementById("debug")
        .textContent =
          "สถานะ: CAMERA RUNNING";


    } catch (error) {

      scannerRunning = false;


      console.error(
        "CAMERA ERROR:",
        error
      );


      let message =
        "❌ เปิดกล้องไม่สำเร็จ";


      if (error && error.name) {

        message +=
          "\n\nError: " +
          error.name;
      }


      if (error && error.message) {

        message +=
          "\n" +
          error.message;
      }


      if (
        error &&
        (
          error.name ===
            "NotAllowedError" ||

          error.name ===
            "PermissionDeniedError"
        )
      ) {

        message =
          "❌ Chrome ไม่ได้รับอนุญาตให้ใช้กล้อง\n\n" +

          "ตรวจสอบ:\n" +

          "การตั้งค่า iPhone → " +
          "ความเป็นส่วนตัวและความปลอดภัย → " +
          "กล้อง → Chrome";
      }


      setStatus(
        message,
        "error"
      );


      document
        .getElementById("retryButton")
        .classList.remove("hidden");


      document
        .getElementById("debug")
        .textContent =
          "Camera error:\n" +
          String(error);
    }

  }


  /* ==========================================
     QR อ่านสำเร็จ
  ========================================== */

  async function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (scanLocked) {
      return;
    }


    scanLocked = true;


    const raw =
      String(decodedText || "")
        .trim();


    if (!raw) {

      scanLocked = false;

      return;
    }


    /* --------------------------------------
       แสดง RAW QR
    -------------------------------------- */

    setStatus(
      "✅ อ่าน QR ได้แล้ว\n\n" +
      "ข้อมูลที่อ่านได้:\n" +
      raw,
      "success"
    );


    document
      .getElementById("debug")
      .textContent =
        "QR READ SUCCESS\n\n" +
        "RAW DATA:\n" +
        raw;


    console.log(
      "QR READ:",
      raw
    );


    /*
      ตอนนี้ยังไม่ส่งกลับ V5

      เราต้องพิสูจน์ก่อนว่า
      กล้อง + html5-qrcode
      อ่าน QR ได้จริง
    */


    await new Promise(
      function(resolve) {
        setTimeout(
          resolve,
          2000
        );
      }
    );


    scanLocked = false;

  }


  /* ==========================================
     QR scan failure
  ========================================== */

  function onScanFailure(
    errorMessage
  ) {

    /*
      ปกติจะเกิดตลอดเวลาที่
      กล้องกำลังค้นหา QR

      ไม่ต้องแสดงบนหน้าจอ
    */

  }


  /* ==========================================
     หยุดกล้อง
  ========================================== */

  async function stopScanner() {

    if (!scanner) {
      return;
    }


    try {

      if (scannerRunning) {

        await scanner.stop();

      }

    } catch (e) {

      console.log(
        "STOP ERROR:",
        e
      );

    }


    try {

      scanner.clear();

    } catch (e) {}


    scanner = null;

    scannerRunning = false;

    scanLocked = false;

  }


  /* ==========================================
     ปิดหน้า
  ========================================== */

  async function closeCamera() {

    await stopScanner();


    setStatus(
      "ปิดกล้องแล้ว"
    );


    try {

      window.close();

    } catch (e) {}

  }

</script>

</body>
</html>

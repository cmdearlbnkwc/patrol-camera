<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกน QR - ระบบตรวจเวร</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 6px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #1f2937;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .success { background: #14532d; }
    .error { background: #7f1d1d; }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .close {
      background: #374151;
      color: white;
    }

    .retry {
      background: #2563eb;
      color: white;
    }

    .hidden { display: none; }

    #debug {
      margin-top: 15px;
      color: #94a3b8;
      font-size: 12px;
      word-break: break-word;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>📷 สแกน QR ตรวจเวร</h1>

  <div class="subtitle">
    กรุณาหันกล้องไปที่ QR จุดตรวจ
  </div>

  <div id="reader"></div>

  <div id="status" class="status">
    กำลังเตรียมกล้อง...
  </div>

  <button id="retryButton" class="button retry hidden" onclick="startScanner()">
    🔄 เปิดกล้องอีกครั้ง
  </button>

  <button class="button close" onclick="closeCamera()">
    ✕ ปิดกล้อง
  </button>

  <div id="debug"></div>

</div>

<script>
  let scanner = null;
  let scannerRunning = false;
  let sendingQR = false;

  function setStatus(message, type) {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = "status";
    if (type) el.classList.add(type);
  }

  function extractQR(raw) {
    if (!raw) return null;

    const text = String(raw).trim();
    const match = text.match(/QR-\d+/i);

    if (!match) return null;

    return match[0].toUpperCase();
  }

  async function startScanner() {
    if (scannerRunning) return;

    document.getElementById("retryButton").classList.add("hidden");
    setStatus("📷 กำลังเปิดกล้อง...");

    try {
      if (typeof Html5Qrcode === "undefined") {
        throw new Error("ไม่สามารถโหลดระบบสแกน QR ได้");
      }

      if (scanner) {
        try { await scanner.stop(); } catch (e) {}
        try { scanner.clear(); } catch (e) {}
        scanner = null;
      }

      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: { exact: "environment" } },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0,
          rememberLastUsedCamera: true,
          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]
        },
        onScanSuccess,
        onScanFailure
      );

      scannerRunning = true;

      setStatus("📷 เปิดกล้องแล้ว\nนำกล้องไปส่อง QR จุดตรวจ");

    } catch (error) {
      scannerRunning = false;

      console.error(error);

      let message = "ไม่สามารถเปิดกล้องได้";

      if (error && error.message) {
        message += "\n\n" + error.message;
      }

      setStatus(message, "error");

      document.getElementById("retryButton").classList.remove("hidden");

      document.getElementById("debug").textContent =
        "Camera error: " + String(error);
    }
  }

  function onScanFailure(errorMessage) {
    // ไม่แสดง error ระหว่างที่กล้องกำลังค้นหา QR
  }

  async function onScanSuccess(decodedText) {
    if (sendingQR) return;

    const qr = extractQR(decodedText);

    if (!qr) {
      setStatus(
        "⚠️ พบ QR แต่ไม่ใช่ QR จุดตรวจของระบบ",
        "error"
      );
      return;
    }

    sendingQR = true;

    setStatus("⏳ พบ " + qr + "\nกำลังส่งกลับระบบ...");

    try {
      if (!window.opener) {
        throw new Error("ไม่พบหน้าระบบตรวจเวรเดิม");
      }

      window.opener.postMessage(
        {
          type: "PATROL_QR_SCAN",
          qr: qr
        },
        "*"
      );

      setStatus("⏳ ส่ง " + qr + " ไปตรวจสอบแล้ว...");
    } catch (error) {
      sendingQR = false;

      setStatus(
        "❌ ไม่สามารถส่ง QR กลับระบบได้",
        "error"
      );
    }
  }

  window.addEventListener("message", async function(event) {
    const data = event.data;

    if (!data) return;
    if (data.type !== "PATROL_QR_RESULT") return;

    if (data.accepted === true) {
      setStatus(
        "✅ QR ผ่านการตรวจสอบ\nกำลังกลับหน้าระบบตรวจเวร...",
        "success"
      );

      await stopScanner();

      setTimeout(function() {
        try {
          window.close();
        } catch (e) {}
      }, 500);

      return;
    }

    sendingQR = false;

    setStatus(
      "❌ QR ไม่ผ่าน\n" +
      (data.message || "ไม่ใช่ QR ที่ใช้ได้ในรอบนี้"),
      "error"
    );

    setTimeout(function() {
      if (scannerRunning) {
        setStatus("📷 กล้องพร้อมสแกนอีกครั้ง");
      }
    }, 2000);
  });

  async function stopScanner() {
    if (!scanner) return;

    try {
      if (scannerRunning) {
        await scanner.stop();
      }
    } catch (e) {}

    try {
      scanner.clear();
    } catch (e) {}

    scanner = null;
    scannerRunning = false;
  }

  async function closeCamera() {
    await stopScanner();

    try {
      window.close();
    } catch (e) {}

    setStatus(
      "ปิดกล้องแล้ว สามารถกลับไปยังหน้าระบบตรวจเวรได้"
    );
  }

  window.addEventListener("load", function() {
    setTimeout(startScanner, 300);
  });
</script>

</body>
</html>

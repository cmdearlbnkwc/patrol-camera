<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>สแกน QR จุดตรวจ</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

h2 {
  margin-top: 10px;
  margin-bottom: 10px;
}

#status {
  margin: 15px 0;
  padding: 12px;
  border-radius: 10px;
  background: #333;
  line-height: 1.5;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
}

button {
  width: 100%;
  max-width: 500px;
  height: 50px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin: 8px auto;
}

#startButton {
  background: #2563eb;
  color: white;
}

#backButton {
  background: #555;
  color: white;
}

.success {
  background: #166534 !important;
}

.error {
  background: #991b1b !important;
}

.info {
  background: #1e3a8a !important;
}

.small {
  font-size: 13px;
  color: #bbb;
  line-height: 1.5;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

</style>

</head>

<body>

<h2>📷 สแกน QR จุดตรวจ</h2>

<div id="status" class="info">
  กดปุ่ม "เปิดกล้อง" เพื่อเริ่มสแกน
</div>

<button
id="startButton"
onclick="startCamera()"

>

📷 เปิดกล้อง </button>

<button
id="backButton"
onclick="goBack()"

>

← กลับ </button>

<div id="reader"></div>

<div class="small">
  กรุณาสแกน QR จุดตรวจจริง<br>
  ระบบจะส่งค่า QR กลับไปยังระบบตรวจเวรอัตโนมัติ
</div>

<script>

/*************************************************
 * GLOBAL
 *************************************************/

let scanner = null;

let scanning = false;

let alreadyScanned = false;


/*************************************************
 * GET RETURN URL
 *************************************************/

function getReturnUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("return") || "";

}


/*************************************************
 * START CAMERA
 *************************************************/

async function startCamera() {

  if (scanning) {
    return;
  }

  alreadyScanned = false;

  setStatus(
    "⏳ กำลังเปิดกล้อง...",
    "info"
  );

  document
    .getElementById("startButton")
    .disabled = true;

  try {

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0
      },

      function(decodedText) {

        if (alreadyScanned) {
          return;
        }

        const qr =
          extractQR(decodedText);

        if (!qr) {

          setStatus(
            "❌ QR นี้ไม่ใช่ QR จุดตรวจ",
            "error"
          );

          return;
        }

        alreadyScanned = true;

        handleQR(qr);

      },

      function(errorMessage) {
        // ไม่ต้องแสดง error ระหว่างค้นหา QR
      }

    );

    scanning = true;

    setStatus(
      "📷 กล้องพร้อมแล้ว\nกรุณาสแกน QR จุดตรวจ",
      "info"
    );

  }

  catch (error) {

    console.error(error);

    setStatus(

      "❌ เปิดกล้องไม่สำเร็จ\n\n" +
      "กรุณาตรวจสอบสิทธิ์การใช้กล้องของ Chrome",

      "error"

    );

    document
      .getElementById("startButton")
      .disabled = false;

  }

}


/*************************************************
 * EXTRACT QR
 *************************************************/

function extractQR(raw) {

  const text =
    String(raw || "")
      .trim()
      .toUpperCase();

  const match =
    text.match(/QR-\d+/i);

  if (!match) {
    return "";
  }

  return match[0].toUpperCase();

}


/*************************************************
 * HANDLE QR
 *************************************************/

async function handleQR(qr) {

  setStatus(

    "✅ อ่าน QR สำเร็จ\n\n" +
    qr +
    "\n\nกำลังกลับระบบตรวจเวร...",

    "success"

  );

  await stopCamera();

  /*
   * URL ของ Web App ที่ส่งเข้ามาตอนเปิดกล้อง
   */

  const returnUrl =
    getReturnUrl();


  if (!returnUrl) {

    setStatus(

      "⚠️ อ่าน QR ได้แล้ว: " +
      qr +
      "\n\n" +
      "แต่ไม่พบที่อยู่ Web App สำหรับส่งกลับ",

      "error"

    );

    document
      .getElementById("startButton")
      .disabled = false;

    return;

  }


  /*
   * ป้องกัน QR ที่ผิดรูปแบบ
   */

  const safeQR =
    encodeURIComponent(qr);


  /*
   * กลับไปยัง Web App
   */

  const separator =
    returnUrl.includes("?")
      ? "&"
      : "?";


  const targetUrl =
    returnUrl +
    separator +
    "qr=" +
    safeQR;


  console.log(
    "กลับ Web App:",
    targetUrl
  );


  /*
   * เปลี่ยนหน้าแท็บนี้กลับไป Web App
   */

  window.location.href =
    targetUrl;

}


/*************************************************
 * STOP CAMERA
 *************************************************/

async function stopCamera() {

  if (!scanner) {
    return;
  }

  try {

    if (scanning) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(
      "stop camera:",
      error
    );

  }

  try {

    await scanner.clear();

  }

  catch (error) {}

  scanner = null;

  scanning = false;

}


/*************************************************
 * BACK
 *************************************************/

function goBack() {

  stopCamera();

  const returnUrl =
    getReturnUrl();

  if (returnUrl) {

    window.location.href =
      returnUrl;

    return;

  }

  window.history.back();

}


/*************************************************
 * STATUS
 *************************************************/

function setStatus(
  text,
  type
) {

  const el =
    document.getElementById(
      "status"
    );

  el.innerText =
    text;

  el.className =
    type || "info";

}

</script>

</body>

</html>
